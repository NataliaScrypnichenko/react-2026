Компонентт -це функція яка повертає якесь представлення або розмітку.
Одні компоненти можуть містити інші компоненти.Це означає що можна створити компонент,назвати його як завгодно і далі потім його використовувати.В папці SRC створюю Component(всі компоненти групувати в окремі деректорії) тут же сстворю
тайпскріптовий файл і вибираю розшириний фацйл JSX(щоб можна було там спокійно писати розмітку)-MYComponent-ут будую все так як в файлі App.tsx/--- і коли написала функцію то потрібно її {export default} щоб можна було її впровадити в інший файл тобто (import MyComponent from "./Component/MyComponent.tsx";)- Тобто тут показує ф-ю що імпортуєтья звідки

Але якщо файлі 'App.tsx' викликати декілька разів <MyComponent /> то буде написано одне і теж декілька разів

Компонент= це сутність яка описує сегмент юзеерінтерфейсу або сегменту розмітки,який ми можемо йогоперевикористовувати- це самий основений момент,компоненти необхідні для того щоб могли потім свій проєкт його блок і такдалі збирати як конструктор

}

export default MyComponent;
